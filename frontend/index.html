<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d14">
  <meta name="description" content="KOMANDO: Komando Monitoring dan Analisis Narasi Digital Online (X, Instagram, Facebook, TikTok, Threads).">
  <title>KOMANDO | Komando Monitoring dan Analisis Narasi Digital Online</title>
  
  <!-- Google Fonts: Space Grotesk, IBM Plex Sans, IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="./src/styles/warroom.css">
  <link rel="stylesheet" href="./src/styles/components.css">
  <link rel="stylesheet" href="./src/styles/komando.css">
</head>
<body>
  <!-- 0. LOGIN PAGE VIEW -->
  <div id="view-login" style="display: none;"></div>

  <div id="app-layout">
    <!-- 1. LEFT SIDEBAR NAVIGATION -->
    <div id="sidebar-container"></div>

    <!-- 2. MAIN APPLICATION CONTENT -->
    <div class="komando-main">
      <!-- Top Navigation & Status Bar -->
      <div id="topbar-container"></div>

      <!-- Scrollable Dynamic Page Viewport -->
      <main class="komando-page-viewport" id="komando-page-viewport">
        <!-- 1. DASHBOARD (/dashboard) -->
        <section id="view-dashboard" class="komando-page-view"></section>

        <!-- 2. PETA SEBARAN BUZZER (/peta-sebaran-buzzer) -->
        <section id="view-peta-sebaran" class="komando-page-view" style="display: none;"></section>

        <!-- 3. PELACAK AKUN MEDSOS (/pelacak-akun-medsos) -->
        <section id="view-pelacak-akun" class="komando-page-view" style="display: none;"></section>

        <!-- 4. MY AGENT (/my-agent) -->
        <section id="view-my-agent" class="komando-page-view" style="display: none;"></section>
      </main>
    </div>
  </div>

  <!-- Hidden trigger untuk Guide Modal -->
  <button id="btn-open-guide" style="display: none;"></button>

  <!-- Application Bootstrap -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
