<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0e13">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' ws: wss: https:; img-src 'self' data: https: blob:;">
  <meta name="description"
    content="whoiam: Platform Intelijen Akun & Forensik Media Sosial (Instagram, X, Facebook, Threads).">
  <title>whoiam</title>

  <!-- Google Fonts: Space Grotesk, IBM Plex Sans, IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" crossorigin="anonymous">

  <link rel="stylesheet" href="./src/styles/warroom.css">
  <link rel="stylesheet" href="./src/styles/components.css">
</head>

<body>
  <div id="app">
    <!-- Header bar diinject oleh JavaScript -->
    <header id="header-container" class="header-bar"></header>

    <!-- Menu Tab Navigasi Utama -->
    <nav class="main-nav-tabs">
      <button class="main-tab-btn active" data-tab="tab-pane-geo" id="nav-btn-geo">
        <i class="fa-solid fa-map-location-dot"></i> PETA & SEBARAN BUZZER
      </button>
      <button class="main-tab-btn" data-tab="tab-pane-osint" id="nav-btn-osint">
        <i class="fa-solid fa-globe"></i> PELACAK AKUN MEDSOS
      </button>
    </nav>

    <!-- Kontainer Panel Konten Tab -->
    <main class="main-tab-content">
      <!-- TAB 1: PETA & SEBARAN BUZZER (TAMPILAN UTAMA DEFAULT) -->
      <section id="tab-pane-geo" class="tab-pane active" style="padding: 0;">
        <!-- GeoBuzzerView inline component dimount di sini secara otomatis -->
      </section>

      <!-- TAB 2: OSINT SCRAPER LANGSUNG -->
      <section id="tab-pane-osint" class="tab-pane">
        <div id="osint-inline-container"
          style="width: 100%; height: 100%; display: flex; flex-direction: column; padding: 14px; overflow-y: auto;">
          <!-- Inline OSINT View dimount di sini -->
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
