<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <defs>
    <!-- Dark shield gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c16" />
      <stop offset="40%" stop-color="#0a120e" />
      <stop offset="100%" stop-color="#050a08" />
    </linearGradient>

    <!-- Cyber Green Gradient -->
    <linearGradient id="cyberGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Sword Gradient -->
    <linearGradient id="swordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <!-- Gold Accent for Text/Trim -->
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
  </defs>

  <!-- Outer Ambient Glow -->
  <path d="M120 12 L196 46 L216 142 L160 220 L120 258 L80 220 L24 142 L44 46 Z" 
        fill="none" stroke="#22c55e" stroke-width="2" opacity="0.3" filter="url(#neonGlow)" />

  <!-- Shield Base Outer Border -->
  <path d="M120 16 L192 48 L212 140 L158 216 L120 252 L82 216 L28 140 L48 48 Z" 
        fill="url(#shieldBg)" stroke="#16a34a" stroke-width="3.5" />

  <!-- Shield Inner Border (Cyber Line) -->
  <path d="M120 25 L184 54 L202 136 L152 208 L120 240 L88 208 L38 136 L56 54 Z" 
        fill="none" stroke="#4ade80" stroke-width="1.8" stroke-dasharray="8 4 16 4" opacity="0.85" />

  <!-- Corner Tech Accents -->
  <polyline points="48,58 58,58 58,48" fill="none" stroke="#86efac" stroke-width="2" />
  <polyline points="192,58 182,58 182,48" fill="none" stroke="#86efac" stroke-width="2" />
  <polyline points="38,130 42,136 48,136" fill="none" stroke="#86efac" stroke-width="2" />
  <polyline points="202,130 198,136 192,136" fill="none" stroke="#86efac" stroke-width="2" />

  <!-- Cyber Hex Grid Detail in Background -->
  <g opacity="0.12" stroke="#4ade80" stroke-width="1">
    <polygon points="120,40 132,47 132,61 120,68 108,61 108,47" fill="none" />
    <polygon points="90,75 102,82 102,96 90,103 78,96 78,82" fill="none" />
    <polygon points="150,75 162,82 162,96 150,103 138,96 138,82" fill="none" />
  </g>

  <!-- ==================== SPARTAN / KSATRIA HELMET ==================== -->
  <g transform="translate(0, 10)">
    <!-- Helmet Crest (Top Mohawk Plume) -->
    <path d="M120 24 L125 38 L123 58 L117 58 L115 38 Z" fill="url(#cyberGreen)" filter="url(#neonGlow)" />
    <path d="M112 36 L120 20 L128 36 L124 55 L116 55 Z" fill="#22c55e" opacity="0.9" />

    <!-- Crest Spikes -->
    <polyline points="110,32 120,20 130,32" fill="none" stroke="#86efac" stroke-width="2" />
    <line x1="120" y1="20" x2="120" y2="52" stroke="#ffffff" stroke-width="1.5" />

    <!-- Helmet Brow & Forehead Armor Plate -->
    <polygon points="96,56 120,48 144,56 138,70 120,66 102,70" fill="#14532d" stroke="#4ade80" stroke-width="1.8" />
    <polygon points="106,58 120,53 134,58 128,66 120,63 112,66" fill="#166534" />

    <!-- Glowing Visor (T-Shape Spartan Slot with Cyber Glow) -->
    <path d="M102 73 L138 73 L126 84 L124 106 L116 106 L114 84 Z" fill="#000" />
    <!-- Visor Slit Glow -->
    <line x1="104" y1="74" x2="136" y2="74" stroke="#4ade80" stroke-width="3" filter="url(#neonGlow)" />
    <line x1="120" y1="74" x2="120" y2="104" stroke="#4ade80" stroke-width="3" filter="url(#neonGlow)" />
    <!-- Core Bright Slit -->
    <line x1="106" y1="74" x2="134" y2="74" stroke="#dcfce7" stroke-width="1.2" />
    <line x1="120" y1="74" x2="120" y2="102" stroke="#dcfce7" stroke-width="1.2" />

    <!-- Cheek Guards & Jaw Armor -->
    <polygon points="94,68 102,73 100,102 90,94 88,76" fill="#0f3d23" stroke="#22c55e" stroke-width="1.5" />
    <polygon points="146,68 138,73 140,102 150,94 152,76" fill="#0f3d23" stroke="#22c55e" stroke-width="1.5" />

    <!-- Chin Guard -->
    <polygon points="112,106 128,106 125,116 115,116" fill="#14532d" stroke="#4ade80" stroke-width="1.5" />
  </g>

  <!-- ==================== TACTICAL CAKRA BANNER ==================== -->
  <g transform="translate(0, 15)">
    <!-- Banner Plate Behind Text -->
    <polygon points="46,128 70,122 170,122 194,128 184,152 165,148 75,148 56,152" 
             fill="#052e16" stroke="#22c55e" stroke-width="2" />
    
    <!-- Accent Line -->
    <line x1="56" y1="125" x2="184" y2="125" stroke="#4ade80" stroke-width="1" />
    <line x1="62" y1="149" x2="178" y2="149" stroke="#16a34a" stroke-width="1.5" />

    <!-- CAKRA Text -->
    <text x="120" y="143" 
          font-family="'Space Grotesk', 'Impact', sans-serif" 
          font-size="21" 
          font-weight="900" 
          letter-spacing="5" 
          text-anchor="middle" 
          fill="url(#goldTrim)" 
          stroke="#052e16" 
          stroke-width="1"
          style="filter: drop-shadow(0 0 6px rgba(74, 222, 128, 0.7));">
      CAKRA
    </text>
  </g>

  <!-- ==================== DOWNWARD CYBER SWORD ==================== -->
  <g transform="translate(0, 10)">
    <!-- Sword Crossguard -->
    <polygon points="98,168 142,168 136,174 104,174" fill="#14532d" stroke="#4ade80" stroke-width="1.2" />
    <!-- Sword Hilt -->
    <line x1="120" y1="158" x2="120" y2="168" stroke="#86efac" stroke-width="3" />
    <circle cx="120" cy="156" r="3" fill="#4ade80" />

    <!-- Sword Blade (Pointing Down) -->
    <polygon points="116,174 124,174 122,232 120,242 118,232" fill="url(#swordGrad)" filter="url(#neonGlow)" />
    <!-- Blade Center Ridge -->
    <line x1="120" y1="174" x2="120" y2="238" stroke="#ffffff" stroke-width="1.2" />
  </g>

  <!-- ==================== WINGED CYBER FLANKS ==================== -->
  <g stroke="#22c55e" stroke-width="1.5" fill="none" opacity="0.85">
    <!-- Left Wing Feathers -->
    <path d="M52 165 L76 178 L72 192" />
    <path d="M60 178 L84 192 L80 206" />
    <path d="M72 195 L96 210 L94 220" />

    <!-- Right Wing Feathers -->
    <path d="M188 165 L164 178 L168 192" />
    <path d="M180 178 L156 192 L160 206" />
    <path d="M168 195 L144 210 L146 220" />
  </g>

  <!-- High-tech Node Dots & Runes -->
  <circle cx="120" cy="25" r="2.5" fill="#4ade80" filter="url(#neonGlow)" />
  <circle cx="48" cy="48" r="2" fill="#4ade80" />
  <circle cx="192" cy="48" r="2" fill="#4ade80" />
  <circle cx="120" cy="250" r="3" fill="#86efac" filter="url(#neonGlow)" />
</svg>