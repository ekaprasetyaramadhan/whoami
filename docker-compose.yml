version: '3.8'

services:
  whoiam:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whoiam-platform
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
